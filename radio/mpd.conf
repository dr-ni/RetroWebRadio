# mpd as systemd user service of the radio user: ~/.config/mpd/mpd.conf
# (installed by "make autostart" if there is none yet)

music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/share/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"
log_file            "~/.local/share/mpd/log"

bind_to_address     "any"
bind_to_address     "~/.local/share/mpd/socket"
port                "6600"

input {
    plugin "curl"
}

# output 1: through the equalizer (~/.asoundrc) and PipeWire
audio_output {
    type        "alsa"
    name        "internal"
    device      "plug:plugequal"
    format      "48000:16:2"
    mixer_type  "software"
}

# output 2: PipeWire directly, e.g. another sink ("wpctl status" lists the
# names); mpush switches between output 1 and 2
audio_output {
    type        "pipewire"
    name        "external"
    mixer_type  "software"
#   target      "alsa_output.platform-...hdmi..."
    enabled     "no"
}

filesystem_charset  "UTF-8"
